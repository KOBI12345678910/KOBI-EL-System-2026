name: Minimal Deploy — techno-kol-ops

on:
  push:
    branches: [minimal-deploy-techno-kol-ops]
  workflow_dispatch:

concurrency:
  group: minimal-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp-2026

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build techno-kol-ops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/techno-kol-ops
          tags: |
            type=sha
            type=raw,value=minimal
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./techno-kol-ops
          file: docker/techno-kol-ops.Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=techno-kol-ops
          cache-to: type=gha,mode=max,scope=techno-kol-ops

      - name: Summary
        run: |
          echo "=========================================="
          echo "techno-kol-ops Docker image built & pushed"
          echo "Registry : ${{ env.REGISTRY }}"
          echo "Image    : ${{ env.IMAGE_PREFIX }}/techno-kol-ops"
          echo "Tags     : minimal, sha, latest"
          echo "=========================================="
